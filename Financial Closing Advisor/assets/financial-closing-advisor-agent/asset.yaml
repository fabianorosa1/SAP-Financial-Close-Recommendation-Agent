apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: financial-closing-advisor-agent
  description: AI agent that monitors financial closing tasks, evaluates dependency chains, recommends next actions in sequence, identifies root causes of blockers, and triggers deadline proximity alerts for financial controllers.
  version: 1.0.0

provides:
  apis:
    - name: financial-closing-advisor-agent
      kind: a2a
      ordId: customer.build:apiResource:financial-closing-advisor-cd126.financial-closing-advisor-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
